<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Projects — VoiceNest</title>

  <link
    rel="stylesheet"
    href="/projects.css"
  >
</head>

<body>

  <header class="top-bar">

    <a href="/dashboard.html" class="brand">
      <span class="brand-mark">VN</span>
      <span>VoiceNest</span>
    </a>

    <a
      href="/dashboard.html"
      class="back-button"
    >
      ← Dashboard
    </a>

  </header>


  <main class="projects-page">

    <section class="projects-header">

      <div>
        <h1>Projects</h1>

        <p>
          Create and manage your content projects
          in one place.
        </p>
      </div>

      <button
        type="button"
        id="createProjectButton"
        class="create-project-button"
      >
        + Create Project
      </button>

    </section>


    <section
      id="projectsList"
      class="projects-list"
    >

      <div class="empty-state">

        <h2>No projects yet</h2>

        <p>
          Create your first project to get started.
        </p>

      </div>

    </section>

  </main>


  <script src="/projects.js"></script>

</body>
      </html>
