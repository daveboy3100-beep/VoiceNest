<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VoiceNest — AI Script Generator</title>

  <style>
    :root {
      --bg: #090b10;
      --panel: #11141c;
      --panel-light: #171a23;
      --border: #292e3a;

      --text: #f4f5f7;
      --muted: #9298a8;

      --accent: #7c5cff;
      --accent-light: #a995ff;

      --success: #45d483;
      --error: #ff6262;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          rgba(124, 92, 255, 0.08),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    textarea,
    select,
    input {
      font: inherit;
    }

    .page {
      width: min(
        100% - 32px,
        900px
      );

      margin: 0 auto;

      padding:
        28px 0 60px;
    }

    /* ========================================
       HEADER
    ======================================== */

    .brand {
      display: inline-flex;

      align-items: center;

      gap: 9px;

      margin-bottom: 42px;

      color: var(--text);

      font-size: 0.95rem;

      font-weight: 900;

      text-decoration: none;
    }

    .brand-mark {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      width: 30px;

      height: 30px;

      border-radius: 9px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-light)
        );

      color: white;

      font-size: 0.8rem;

      font-weight: 900;
    }

    /* ========================================
       HERO
    ======================================== */

    .hero {
      margin-bottom: 28px;

      text-align: center;
    }

    .hero-label {
      display: inline-block;

      margin-bottom: 10px;

      color: var(--accent-light);

      font-size: 0.68rem;

      font-weight: 900;

      letter-spacing: 0.12em;
    }

    .hero h1 {
      margin: 0 0 10px;

      font-size:
        clamp(1.8rem, 6vw, 2.7rem);

      line-height: 1.1;

      font-weight: 900;
    }

    .hero p {
      max-width: 560px;

      margin: 0 auto;

      color: var(--muted);

      font-size: 0.92rem;

      line-height: 1.6;
    }

    /* ========================================
       GENERATOR CARD
    ======================================== */

    .generator-card {
      padding: 22px;

      border:
        1px solid var(--border);

      border-radius: 18px;

      background:
        rgba(17, 20, 28, 0.94);

      box-shadow:
        0 18px 50px
        rgba(0, 0, 0, 0.18);
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;

      margin-bottom: 8px;

      color: var(--text);

      font-size: 0.78rem;

      font-weight: 800;
    }

    .field textarea,
    .field select {
      width: 100%;

      border:
        1px solid var(--border);

      border-radius: 11px;

      outline: none;

      background: #0d1017;

      color: var(--text);

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .field textarea {
      min-height: 145px;

      padding: 14px;

      resize: vertical;

      line-height: 1.55;
    }

    .field select {
      min-height: 44px;

      padding: 0 12px;

      cursor: pointer;
    }

    .field textarea::placeholder {
      color: #626878;
    }

    .field textarea:focus,
    .field select:focus {
      border-color:
        rgba(124, 92, 255, 0.65);

      box-shadow:
        0 0 0 3px
        rgba(124, 92, 255, 0.08);
    }

    .options-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 14px;
    }

    /* ========================================
       GENERATE BUTTON
    ======================================== */

    .generate-btn {
      width: 100%;

      min-height: 48px;

      margin-top: 4px;

      border: 0;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-light)
        );

      color: white;

      font-size: 0.84rem;

      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    .generate-btn:hover:not(:disabled) {
      transform:
        translateY(-1px);

      box-shadow:
        0 12px 28px
        rgba(124, 92, 255, 0.25);
    }

    .generate-btn:active:not(:disabled) {
      transform:
        translateY(0);
    }

    .generate-btn:disabled {
      cursor: wait;

      opacity: 0.65;
    }

    /* ========================================
       MESSAGE
    ======================================== */

    .message {
      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 0.78rem;

      line-height: 1.5;
    }

    .message.hidden {
      display: none;
    }

    .message.error {
      border:
        1px solid
        rgba(255, 98, 98, 0.25);

      background:
        rgba(255, 98, 98, 0.08);

      color: #ff8585;
    }

    .message.success {
      border:
        1px solid
        rgba(69, 212, 131, 0.25);

      background:
        rgba(69, 212, 131, 0.08);

      color: var(--success);
    }

    /* ========================================
       RESULT
    ======================================== */

    .result-panel {
      margin-top: 20px;

      padding: 20px;

      border:
        1px solid var(--border);

      border-radius: 16px;

      background: #11141c;
    }

    .result-panel.hidden {
      display: none;
    }

    .result-label {
      display: block;

      margin-bottom: 6px;

      color: var(--accent-light);

      font-size: 0.68rem;

      font-weight: 900;

      letter-spacing: 0.1em;
    }

    .result-panel h2 {
      margin: 0 0 14px;

      font-size: 1rem;

      font-weight: 800;
    }

    #generatedScript {
      min-height: 300px;

      width: 100%;

      padding: 15px;

      border:
        1px solid var(--border);

      border-radius: 11px;

      outline: none;

      resize: vertical;

      background: #0d1017;

      color: var(--text);

      font-size: 0.86rem;

      line-height: 1.65;
    }

    .result-actions {
      display: flex;

      gap: 10px;

      margin-top: 12px;
    }

    .result-btn {
      min-height: 40px;

      padding: 0 15px;

      border:
        1px solid var(--border);

      border-radius: 9px;

      background: #202430;

      color: var(--text);

      font-size: 0.76rem;

      font-weight: 800;

      cursor: pointer;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .result-btn:hover {
      background: #292e3a;

      border-color:
        rgba(124, 92, 255, 0.35);
    }

    .result-btn.primary {
      background:
        rgba(124, 92, 255, 0.1);

      border-color:
        rgba(124, 92, 255, 0.35);

      color: var(--accent-light);
    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 600px) {

      .page {
        width:
          min(
            100% - 22px,
            900px
          );

        padding-top: 20px;
      }

      .top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 42px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text);
  font-weight: 800;
  font-size: 18px;
      }

      .generator-card {
        padding: 16px;
      }

      .options-grid {
        grid-template-columns: 1fr;
      }

      .result-actions {
        flex-direction: column;
      }

      .result-btn {
        width: 100%;
      }

    }
    .public-auth {
  display: flex;
  align-items: center;
  gap: 8px;
}

.public-auth a {
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 8px;
  transition: opacity 0.2s ease;
}

.public-auth a:hover {
  opacity: 0.85;
}

.public-auth-login {
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.25);
}

.public-auth-signup {
  color: #fff;
  background: #6c3cff;
      }
  </style>
</head>

<body>

  <main class="page">

    <header class="top-bar">
  <a
    href="/index.html"
    class="brand"
  >
    <span class="brand-mark">
      VN
    </span>

    VoiceNest
  </a>

  <div class="public-auth">
    <a href="/login.html" class="public-auth-login">Log in</a>
    <a href="/signup.html" class="public-auth-signup">Sign up</a>
  </div>
    </header>

    <section class="hero">

      <span class="hero-label">
        POWERED BY GEMINI AI
      </span>

      <h1>
        AI Script Generator
      </h1>

      <p>
        Turn your ideas into engaging,
        ready-to-use scripts in seconds.
      </p>

    </section>


    <section class="generator-card">

      <div class="field">

        <label for="topicInput">
          Topic or Idea
        </label>

        <textarea
          id="topicInput"
          placeholder="Tell VoiceNest what you want your script to be about..."
        ></textarea>

      </div>


      <div class="options-grid">

        <div class="field">

          <label for="platformSelect">
            Platform
          </label>

          <select id="platformSelect">

            <option value="YouTube">
              YouTube
            </option>

            <option value="TikTok">
              TikTok
            </option>

            <option value="Instagram">
              Instagram
            </option>

            <option value="Facebook">
              Facebook
            </option>

          </select>

        </div>


        <div class="field">

          <label for="contentTypeSelect">
            Content Type
          </label>

          <select id="contentTypeSelect">

            <option value="Educational">
              Educational
            </option>

            <option value="Story">
              Story
            </option>

            <option value="Documentary">
              Documentary
            </option>

            <option value="Motivational">
              Motivational
            </option>

            <option value="Explainer">
              Explainer
            </option>

          </select>

        </div>


        <div class="field">

          <label for="toneSelect">
            Tone
          </label>

          <select id="toneSelect">

            <option value="Cinematic">
              Cinematic
            </option>

            <option value="Professional">
              Professional
            </option>

            <option value="Casual">
              Casual
            </option>

            <option value="Energetic">
              Energetic
            </option>

            <option value="Emotional">
              Emotional
            </option>

          </select>

        </div>


        <div class="field">

          <label for="durationSelect">
            Target Duration
          </label>

          <select id="durationSelect">

            <option value="30 seconds">
              30 seconds
            </option>

            <option value="1 minute">
              1 minute
            </option>

            <option value="2 minutes" selected>
              2 minutes
            </option>

            <option value="5 minutes">
              5 minutes
            </option>

            <option value="10 minutes">
              10 minutes
            </option>

          </select>

        </div>

      </div>


      <button
        type="button"
        id="generateScriptBtn"
        class="generate-btn"
      >
        Generate Script
      </button>


      <div
        id="message"
        class="message hidden"
      ></div>

    </section>


    <section
      id="resultPanel"
      class="result-panel hidden"
    >

      <span class="result-label">
        SCRIPT READY
      </span>

      <h2>
        Your generated script
      </h2>

      <textarea
        id="generatedScript"
        placeholder="Your generated script will appear here..."
      ></textarea>

      <div class="result-actions">

  <button
    type="button"
    id="copyScriptBtn"
    class="result-btn primary"
  >
    Copy Script
  </button>

  <button
    type="button"
    id="useInVoiceoverBtn"
    class="result-btn"
  >
    🎙️ Use in Voiceover
  </button>

  <button
    type="button"
    id="saveScriptBtn"
    class="result-btn"
  >
    💾 Save Script
  </button>

  <button
    type="button"
    id="clearScriptBtn"
    class="result-btn"
  >
    Clear
  </button>

      </div>
    
    </section>

  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://okbipirfsusciztzstka.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_wp1MJ7xmnJjseGjFtM9PWQ_xQWRh7hW";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

    const topicInput =
      document.getElementById(
        "topicInput"
      );

    const platformSelect =
      document.getElementById(
        "platformSelect"
      );

    const contentTypeSelect =
      document.getElementById(
        "contentTypeSelect"
      );

    const toneSelect =
      document.getElementById(
        "toneSelect"
      );

    const durationSelect =
      document.getElementById(
        "durationSelect"
      );

    const generateScriptBtn =
      document.getElementById(
        "generateScriptBtn"
      );

    const message =
      document.getElementById(
        "message"
      );

    const resultPanel =
      document.getElementById(
        "resultPanel"
      );

    const generatedScript =
      document.getElementById(
        "generatedScript"
      );

    const copyScriptBtn =
      document.getElementById(
        "copyScriptBtn"
      );
        const useInVoiceoverBtn =
  document.getElementById(
    "useInVoiceoverBtn"
  );
    const clearScriptBtn =
      document.getElementById(
        "clearScriptBtn"
      );
       const saveScriptBtn =
  document.getElementById(
    "saveScriptBtn"
  );

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        `message ${type}`;

    }


    function hideMessage() {

      message.className =
        "message hidden";

      message.textContent =
        "";

    }


    function setGeneratingState(
      isGenerating
    ) {

      generateScriptBtn.disabled =
        isGenerating;

      if (isGenerating) {

        generateScriptBtn.textContent =
          "Creating your script...";

      } else {

        generateScriptBtn.textContent =
          "Generate Script";

      }

    }


    clearScriptBtn.addEventListener(
      "click",
      () => {

        generatedScript.value =
          "";

        resultPanel.className =
          "result-panel hidden";

        hideMessage();

      }
    );


    copyScriptBtn.addEventListener(
      "click",
      async () => {

        if (
          !generatedScript.value.trim()
        ) {

          return;
        }

        try {

          await navigator.clipboard.writeText(
            generatedScript.value
          );

          showMessage(
            "Script copied to clipboard.",
            "success"
          );

        } catch {

          showMessage(
            "Unable to copy the script. Please copy it manually.",
            "error"
          );

        }

      }
    );
  saveScriptBtn.addEventListener(
  "click",
  async () => {

    hideMessage();

    const script =
      generatedScript.value.trim();

    if (!script) {

      showMessage(
        "There is no generated script to save.",
        "error"
      );

      return;

    }


    saveScriptBtn.disabled =
      true;

    saveScriptBtn.textContent =
      "Saving...";


    try {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();


      if (!session) {

        throw new Error(
          "Please sign in before saving a script."
        );

      }


      const response =
        await fetch(
          "/api/save-script",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Authorization":
                `Bearer ${session.access_token}`
            },

            body:
              JSON.stringify({

                title:
                  topicInput.value.trim() ||
                  "Untitled Script",

                script:
                  script,

                topic:
                  topicInput.value.trim(),

                platform:
                  platformSelect.value,

                contentType:
                  contentTypeSelect.value,

                tone:
                  toneSelect.value,

                duration:
                  durationSelect.value

              })
          }
        );


      let data = {};


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "The server returned an invalid response."
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Unable to save your script."
        );

      }


      saveScriptBtn.textContent =
        "✓ Saved";

      showMessage(
        "Script saved successfully.",
        "success"
      );


    } catch (error) {

      console.error(
        "Save script error:",
        error
      );


      saveScriptBtn.disabled =
        false;

      saveScriptBtn.textContent =
        "💾 Save Script";


      showMessage(
        error.message ||
        "Unable to save your script. Please try again.",
        "error"
      );

    }

  }
);
      useInVoiceoverBtn.addEventListener(
  "click",
  () => {

    const script =
      generatedScript.value.trim();

    if (!script) {
      return;
    }

    const encodedScript =
      encodeURIComponent(script);

    window.location.href =
      `/index.html?script=${encodedScript}`;
  }
);

    generateScriptBtn.addEventListener(
  "click",
  async () => {

    hideMessage();

    const topic =
      topicInput.value.trim();

    if (!topic) {

      showMessage(
        "Please enter a topic or idea first.",
        "error"
      );

      topicInput.focus();

      return;
    }

    setGeneratingState(true);

    resultPanel.className =
      "result-panel hidden";

    try {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();

      if (!session) {

        throw new Error(
          "Please sign in before generating a script."
        );

      }

      const response =
        await fetch(
          "/api/generate-script",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Authorization":
                `Bearer ${session.access_token}`
            },

            body: JSON.stringify({

              topic:
                topic,

              platform:
                platformSelect.value,

              contentType:
                contentTypeSelect.value,

              tone:
                toneSelect.value,

              duration:
                durationSelect.value

            })
          }
        );


      let data = {};

      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "The server returned an invalid response."
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Script generation failed."
        );

      }


      if (
        !data.script ||
        !data.script.trim()
      ) {

        throw new Error(
          "No script was returned."
        );

      }


      generatedScript.value =
        data.script;

      resultPanel.className =
        "result-panel";

      showMessage(
        "Script generated successfully.",
        "success"
      );

      resultPanel.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });


    } catch (error) {

      console.error(
        "Script generation error:",
        error
      );

      showMessage(
        error.message ||
        "Something went wrong while generating your script. Please try again.",
        "error"
      );

      resultPanel.className =
        "result-panel hidden";


    } finally {

      setGeneratingState(false);

    }

  }
);
    
  </script>

</body>
  </html>
