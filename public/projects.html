<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Projects — VoiceNest</title>

  <link
    rel="stylesheet"
    href="/projects.css"
  >
</head>

<body>

  <header class="top-bar">

    <a href="/dashboard.html" class="brand">
      <span class="brand-mark">VN</span>
      <span>VoiceNest</span>
    </a>

    <a
      href="/dashboard.html"
      class="back-button"
    >
      ← Dashboard
    </a>

  </header>


  <main class="projects-page">

    <section class="projects-header">

      <div>
        <h1>Projects</h1>

        <p>
          Create and manage your content projects
          in one place.
        </p>
      </div>

      <button
        type="button"
        id="createProjectButton"
        class="create-project-button"
      >
        + Create Project
      </button>

    </section>


    <section
      id="projectsList"
      class="projects-list"
    >

      <div class="empty-state">

        <h2>No projects yet</h2>

        <p>
          Create your first project to get started.
        </p>

      </div>

    </section>

  </main>
<div
  id="createProjectModal"
  class="modal hidden"
  aria-hidden="true"
>
  <div
    class="modal-backdrop"
    id="modalBackdrop"
  ></div>

  <div
    class="modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="createProjectTitle"
  >

    <div class="modal-header">

      <div>
        <h2 id="createProjectTitle">
          Create Project
        </h2>

        <p>
          Give your project a name to get started.
        </p>
      </div>

      <button
        type="button"
        id="closeProjectModal"
        class="modal-close"
        aria-label="Close"
      >
        ×
      </button>

    </div>

    <form id="createProjectForm">

      <label
        for="projectName"
        class="project-name-label"
      >
        Project name
      </label>

      <input
        type="text"
        id="projectName"
        name="projectName"
        class="project-name-input"
        placeholder="e.g. My YouTube Video"
        maxlength="100"
        autocomplete="off"
        required
      >
<label
  for="projectDescription"
  class="project-description-label"
>
  Description
</label>

<textarea
  id="projectDescription"
  name="projectDescription"
  class="project-description-input"
  placeholder="Optional — describe what this project is about"
  maxlength="300"
  rows="4"
></textarea>
      <div class="modal-actions">

        <button
          type="button"
          id="cancelProjectButton"
          class="cancel-project-button"
        >
          Cancel
        </button>

        <button
          type="submit"
          id="submitProjectButton"
          class="submit-project-button"
        >
          Create Project
        </button>

      </div>

    </form>

  </div>
</div>

  <script src="/projects.js"></script>

</body>
      </html>
